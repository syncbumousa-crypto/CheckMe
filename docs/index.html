<!-- ============================================================ -->
<!-- # ⚙️ 📄  PAGE SETUP -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Sets up the page: its type, Arabic language, right to left text, -->
<!-- #    letter encoding so Arabic shows the right way, phone screen size, -->
<!-- #    the tab name, and it calls the style files -->
<!-- # 🔗 None of this shows on the page. It all runs before the content is -->
<!-- #    drawn. The v number on every file is bumped on every publish, -->
<!-- #    so a visitor never gets an old copy out of the browser memory -->
<!-- ============================================================ -->
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CheckMe</title>
<link rel="stylesheet" href="🏠shell/F-End/shell.css?v=7">
<link rel="stylesheet" href="☁️CloudingStorage/F-End/storage.css?v=7">
<link rel="stylesheet" href="📅DayBoard/F-End/DayBoard.css?v=7">
<link rel="stylesheet" href="🪟Views/F-End/Views.css?v=7">
</head>
<body>

<!-- ============================================================ -->
<!-- # 🗓️ 🏠  THE BOARD IS THE HOME SCREEN, AND IT IS ALL OF IT -->
<!-- # 🔤 HTML -->
<!-- # 🎯 The year grid, and one line under it for messages -->
<!-- # 🔗 Two empty shells. The board screen file fills them, because -->
<!-- #    what goes inside is worked out from the item list and the -->
<!-- #    year: three head rows and three hundred and sixty five day -->
<!-- #    rows are not things to type by hand, and typing them here -->
<!-- #    would make this file the second place that knows what the -->
<!-- #    thirty things are. Nothing stands above the grid any more and -->
<!-- #    no key stands below it: the strip of year, months and account -->
<!-- #    was furniture, and every line of it was a day pushed off the -->
<!-- #    bottom of the screen -->
<!-- ============================================================ -->
<div class="view" id="view-board">
  <div class="board">
    <div class="grid-wrap" id="grid-wrap"></div>
    <p class="note" id="board-note"></p>
  </div>
</div>

<!-- ============================================================ -->
<!-- # 🪟 ⬜  THE OTHER MAIN SCREENS, STILL EMPTY -->
<!-- # 🔤 HTML -->
<!-- # 🎯 One screen that stands in for whichever month was pressed, -->
<!-- #    carrying its name and a line saying it is waiting -->
<!-- # 🔗 One screen and not twelve. Nothing is in any of them yet, so -->
<!-- #    twelve copies of nothing would be twelve things to keep in -->
<!-- #    step; the title is rewritten when a month is pressed. The -->
<!-- #    day they stop being alike, each gets its own -->
<!-- ============================================================ -->
<div class="view" id="view-blank" hidden>
  <div class="blank-screen">
    <h2 class="blank-title" id="blank-title"></h2>
    <p class="blank-note">هذه الشاشة فارغةٌ بانتظار تفصيلك.</p>
  </div>
</div>

<!-- ============================================================ -->
<!-- # 🧰 📍  THE DOCK ALONG THE BOTTOM -->
<!-- # 🔤 HTML -->
<!-- # 🎯 The account on the far right, then the buttons that switch -->
<!-- #    between the main screens: the board, and the twelve months -->
<!-- # 🔗 These SWITCH the screen, they do not open a window over it. -->
<!-- #    The grid is the board's own main screen and `تتبّع أدائك` is -->
<!-- #    its name; each month has a main screen of its own. So the -->
<!-- #    dock is a row of tabs along the bottom, and the one being -->
<!-- #    shown is the one lit. The account is the exception and stays -->
<!-- #    a sheet: signing in is a thing you finish and dismiss, not a -->
<!-- #    place you go. The month buttons are left empty for the views -->
<!-- #    screen file to fill, so the twelve names live in one place -->
<!-- ============================================================ -->
<div class="dock">
  <button class="who-btn" type="button" id="who-btn"></button>
  <button class="dock-btn is-on" type="button" id="track-btn">تتبّع أدائك</button>
  <div class="dock-months" id="dock-months"></div>
</div>

<!-- ============================================================ -->
<!-- # 🔑 🪟  THE ACCOUNT, IN A SHEET OVER THE BOARD -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Holds the three account panels and the three storage steps, -->
<!-- #    behind a button in the strip above -->
<!-- # 🔗 The panels inside are UNCHANGED and keep every id they had, -->
<!-- #    because their own two files still drive them by those ids. -->
<!-- #    What changed is only where they sit: the board is the home -->
<!-- #    screen now, so signing in cannot be the first thing the -->
<!-- #    visitor meets. The sheet starts hidden, and the hidden rule -->
<!-- #    in shell.css beats its display, or it would cover the board -->
<!-- ============================================================ -->
<div id="account-sheet" hidden>
  <button class="sheet-close" type="button" id="sheet-close" title="إغلاق">×</button>

  <div class="box" id="choice">
    <button class="btn btn-main" type="button" id="go-signup">إنشاء حساب</button>
    <button class="btn" type="button" id="go-login">تسجيل الدخول</button>
  </div>

  <form class="box" id="form" hidden>
    <h1 class="title" id="form-title"></h1>
    <input class="field" id="email" type="email" placeholder="البريد" required autocomplete="email">
    <input class="field" id="password" type="password" placeholder="كلمة السر" required minlength="6" autocomplete="current-password">
    <button class="btn btn-main" type="submit" id="submit"></button>
    <button class="btn btn-flat" type="button" id="back">رجوع</button>
    <p class="note" id="note"></p>
  </form>

  <div class="box" id="session" hidden>
    <p class="who" id="who"></p>

    <div class="spinner" id="session-spin"></div>

    <div class="stack" id="step-link" hidden>
      <button class="btn btn-main" type="button" id="link-google">اربط حساب قوقل</button>
    </div>

    <div class="stack" id="step-place" hidden>
      <p class="where">مكان الحفظ المستمر</p>

      <div class="spinner" id="probe-spin" hidden></div>

      <div class="stack" id="place-buttons">
        <button class="btn btn-main" type="button" id="pick-place">اختر المكان بنفسك</button>
        <button class="btn" type="button" id="auto-place">خزّنه في مجلد CheckMe في جذر ملفاتي</button>
      </div>

      <p class="hint" id="shield-hint" hidden></p>
    </div>

    <div class="stack" id="step-done" hidden>
      <p class="where" id="drive-where"></p>
      <button class="btn" type="button" id="save-test">احفظ في ملفي</button>
      <a class="btn btn-flat" id="drive-open" href="#" target="_blank" rel="noopener">افتح الملف في درايف</a>
      <button class="btn btn-flat" type="button" id="change-place">غيّر مكان الحفظ</button>
    </div>

    <p class="note" id="drive-note"></p>
    <button class="btn btn-flat" type="button" id="logout">خروج</button>
  </div>
</div>

<!-- ============================================================ -->
<!-- # 🔖 👁️  VERSION MARK -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Shows which build of the site the visitor is actually running, -->
<!-- #    in small faint text in the corner -->
<!-- # 🔗 Must match the v number on the file calls. When it does not, -->
<!-- #    the browser is serving an old copy out of its memory, and this -->
<!-- #    one line says so at a glance instead of leaving it a guess -->
<!-- ============================================================ -->
<p class="build">v7</p>

<!-- ============================================================ -->
<!-- # 📦 🔌  LIBRARIES AND SCRIPTS -->
<!-- # 🔤 HTML -->
<!-- # 🎯 Brings in three outside libraries: the sign in service, Google -->
<!-- #    permission, and the Google file window. Then this site's own six -->
<!-- #    files, in the order they need each other -->
<!-- # 🔗 Sits at the end of body so the panels above already exist when the -->
<!-- #    scripts look for them. The libraries come first because the site -->
<!-- #    files use them. Then the three B-End files, which show nothing: -->
<!-- #    two talk to the services and one holds what is being checked. -->
<!-- #    Then the three F-End files, which draw the screen and call the -->
<!-- #    names the B-End files left ready. The order matters twice: a -->
<!-- #    screen file loaded first would look for a name that does not -->
<!-- #    exist yet, and the board screen is LAST because it reads the -->
<!-- #    flag the account screen sets, so it can say on its own button -->
<!-- #    whether the Drive is linked without asking any service -->
<!-- ============================================================ -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://accounts.google.com/gsi/client"></script>
<script src="https://apis.google.com/js/api.js"></script>
<script src="🔐accounts/B-End/ProfilesSupabase.js?v=7"></script>
<script src="☁️CloudingStorage/B-End/ProfilesClouding.js?v=7"></script>
<script src="📅DayBoard/B-End/DayBoardStore.js?v=7"></script>
<script src="🔐accounts/F-End/ProfilesSupabaseScreen.js?v=7"></script>
<script src="☁️CloudingStorage/F-End/ProfilesCloudingScreen.js?v=7"></script>
<script src="📅DayBoard/F-End/DayBoardScreen.js?v=7"></script>
<script src="🪟Views/F-End/ViewsScreen.js?v=7"></script>

</body>
</html>
